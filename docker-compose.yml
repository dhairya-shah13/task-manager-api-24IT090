version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: task-manager-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: task-manager-api
    volumes:
      - mongodb_data:/data/db
    networks:
      backend-network:
        aliases:
          - mongodb
          - mongo
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: task-manager-api-container
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/task-manager-api
      - JWT_SECRET=super_secret_jwt_key_24IT090
      - NOTIFICATION_DELAY_MS=2000
      - NOTIFICATION_MODE=async
      - SIMULATE_LISTENER_ERROR=false
      - DOCKER_CONTAINER=true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
